name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/queso/formbricks-patched
  TAG: 6.1.1-node24.22.1
  NODE_VERSION: v24.22.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load locally for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:test

      - name: Verify Node version and sharp
        run: |
          set -eu
          v=$(docker run --rm --entrypoint node "$IMAGE:test" --version)
          echo "node --version: $v"
          test "$v" = "$NODE_VERSION"
          docker run --rm --entrypoint node -w /home/nextjs "$IMAGE:test" \
            -e "const s=require('sharp'); console.log('sharp', s.versions)"
          docker run --rm --entrypoint node "$IMAGE:test" -e "
            const z=require('zlib'); const b=Buffer.from('x'.repeat(100000));
            if (!z.brotliDecompressSync(z.brotliCompressSync(b)).equals(b)) process.exit(1);
            console.log('brotli round-trip ok')"
          docker run --rm --entrypoint node -w /home/nextjs "$IMAGE:test" \
            -e "require('lightningcss-linux-x64-musl'); console.log('lightningcss ok')"
          test "$(docker run --rm --entrypoint id "$IMAGE:test" -un)" = "nextjs"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ steps.vars.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=formbricks 6.1.1 with Node.js 24.22.1
